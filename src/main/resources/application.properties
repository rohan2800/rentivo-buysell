spring.application.name=rentivo-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rentivo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
server.port=${PORT:8080}

rentivo.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-at-least-32-bytes}
rentivo.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
rentivo.otp.dev-code=${OTP_DEV_CODE:123456}
rentivo.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}
rentivo.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}
