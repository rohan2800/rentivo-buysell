# ---- Shared settings (all profiles). Local defaults live in application-dev.properties. ----
spring.application.name=rentivo-backend
spring.profiles.default=dev
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# Database: schema is owned by Flyway, Hibernate only validates it.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.default-page-size=20

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}

# Application settings
rentivo.jwt.secret=${JWT_SECRET}
rentivo.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
rentivo.jwt.issuer=rentivo
rentivo.otp.dev-mode=false
rentivo.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}
rentivo.otp.max-attempts=5
rentivo.otp.resend-cooldown-seconds=60
rentivo.otp.max-per-hour=5
rentivo.upload.dir=${UPLOAD_DIR:./uploads}
rentivo.upload.max-images-per-listing=10
rentivo.upload.max-image-bytes=10485760
rentivo.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
rentivo.subscriptions.dev-activation-enabled=false
rentivo.bootstrap-admin-phone=${BOOTSTRAP_ADMIN_PHONE:}
