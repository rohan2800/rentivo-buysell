# Local development only. Never activate this profile in production.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rentivo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

rentivo.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
rentivo.otp.dev-mode=true
rentivo.otp.dev-code=${OTP_DEV_CODE:123456}
rentivo.subscriptions.dev-activation-enabled=true
rentivo.bootstrap-admin-phone=${BOOTSTRAP_ADMIN_PHONE:9999999999}
rentivo.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging.level.com.rentivo=DEBUG
