# Production: everything comes from environment variables, nothing has a default.
# Required: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET (32+ chars), CORS_ALLOWED_ORIGINS
# Required for media: S3_BUCKET (AWS credentials come from the environment/instance role, never
# from a property — see the S3StorageService javadoc). S3_PUBLIC_BASE_URL is optional (CloudFront).
# Startup fails fast if dev OTP mode or dev subscription activation is enabled.
rentivo.upload.provider=${STORAGE_PROVIDER:s3}
logging.level.root=INFO
logging.level.com.rentivo=INFO
